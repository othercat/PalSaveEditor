name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core
        run: dotnet run --project tests/PalSaveEditor.Core.Tests/PalSaveEditor.Core.Tests.csproj -c Release
      - name: Build solution
        run: dotnet build PalSaveEditor.slnx -c Release
      - name: Publish self-contained app
        run: >-
          dotnet publish src/PalSaveEditor.WinForms/PalSaveEditor.WinForms.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: PalSaveEditor-win-x64
          path: artifacts/win-x64/
