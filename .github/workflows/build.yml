name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core (.NET 8)
        run: |
          dotnet run --project tests/PalSaveEditor.Core.Tests/PalSaveEditor.Core.Tests.csproj -c Release -f net8.0
          dotnet run --project tests/PalSaveChecker.Core.Tests/PalSaveChecker.Core.Tests.csproj -c Release -f net8.0
      - name: Build solution
        run: dotnet build PalSaveEditor.slnx -c Release
      - name: Test core (.NET Framework 4.7.2)
        shell: pwsh
        run: |
          .\tests\PalSaveEditor.Core.Tests\bin\Release\net472\PalSaveEditor.Core.Tests.exe
          .\tests\PalSaveChecker.Core.Tests\bin\Release\net472\PalSaveChecker.Core.Tests.exe
      - name: Publish Win7-compatible apps
        shell: pwsh
        run: |
          dotnet publish src/PalSaveEditor.WinForms/PalSaveEditor.WinForms.csproj -c Release -f net472 -p:PlatformTarget=x86 -p:DebugType=None -p:DebugSymbols=false -o artifacts/win7-net472
          dotnet publish src/PalSaveChecker.WinForms/PalSaveChecker.WinForms.csproj -c Release -f net472 -p:PlatformTarget=x86 -p:DebugType=None -p:DebugSymbols=false -o artifacts/win7-net472
          Copy-Item -LiteralPath LICENSE -Destination artifacts/win7-net472/PalSaveEditor-LICENSE-GPL-2.0.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PalSaveEditor-tools-win7-net472
          path: artifacts/win7-net472/
